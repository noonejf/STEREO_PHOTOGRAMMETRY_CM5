<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#295a25" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer connections -->
    <polygon points="50,15 80,45 70,85 30,85 20,45" />
    
    <!-- Dashed inner connections -->
    <g stroke-dasharray="5,5" stroke-width="4">
      <line x1="20" y1="45" x2="80" y2="45" /> <!-- Horizontal -->
      <line x1="50" y1="15" x2="50" y2="85" /> <!-- Vertical -->
      <line x1="30" y1="85" x2="50" y2="45" /> <!-- Diagonal to center -->
      <line x1="70" y1="85" x2="50" y2="45" />
    </g>
    
    <!-- Nodes (circles) -->
    <circle cx="50" cy="15" r="7" fill="#295a25" stroke="none" />
    <circle cx="20" cy="45" r="7" fill="#295a25" stroke="none" />
    <circle cx="80" cy="45" r="7" fill="#295a25" stroke="none" />
    <circle cx="30" cy="85" r="7" fill="#295a25" stroke="none" />
    <circle cx="70" cy="85" r="7" fill="#295a25" stroke="none" />
  </g>
</svg>
