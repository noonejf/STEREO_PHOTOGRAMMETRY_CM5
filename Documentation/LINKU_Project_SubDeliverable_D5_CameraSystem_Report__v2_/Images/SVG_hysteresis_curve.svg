<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Axes -->
    <g stroke="#295a25" stroke-width="4" stroke-dasharray="8,8">
      <line x1="50" y1="15" x2="50" y2="85" />
      <line x1="15" y1="50" x2="85" y2="50" />
    </g>
    <!-- Hysteresis Loops -->
    <!-- Curve 1 (Right/Bottom) -->
    <path d="M 25 80 C 65 80, 65 20, 75 20" stroke="#295a25" stroke-width="6" />
    <!-- Curve 2 (Left/Top) -->
    <path d="M 25 80 C 35 80, 35 20, 75 20" stroke="#295a25" stroke-width="6" />
  </g>
</svg>
