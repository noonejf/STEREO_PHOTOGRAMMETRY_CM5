<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#295a25" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Camera -->
    <rect x="15" y="15" width="25" height="18" rx="2" />
    <circle cx="27.5" cy="24" r="4" />
    <!-- Right Camera -->
    <rect x="60" y="15" width="25" height="18" rx="2" />
    <circle cx="72.5" cy="24" r="4" />
    <!-- Dashed connection between cameras -->
    <line x1="40" y1="24" x2="60" y2="24" stroke-dasharray="6,6" stroke-width="4" />

    <!-- Dashed Lines downwards -->
    <g stroke-dasharray="6,6" stroke-width="4">
      <line x1="27.5" y1="33" x2="50" y2="72" />
      <line x1="72.5" y1="33" x2="50" y2="72" />
      <line x1="50" y1="24" x2="50" y2="72" />
    </g>
    <!-- Base / Object -->
    <path d="M 42 85 C 42 75, 58 75, 58 85 Z" stroke-width="4" />
    <line x1="30" y1="85" x2="70" y2="85" stroke-width="5" />
  </g>
</svg>
