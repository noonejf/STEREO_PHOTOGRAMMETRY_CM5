    <circle cx="50" cy="15" r="2.5" fill="#ffffff" stroke="none" />
    <circle cx="80" cy="32.5" r="2.5" fill="#ffffff" stroke="none" />
    <circle cx="80" cy="67.5" r="2.5" fill="#ffffff" stroke="none" />
    <circle cx="50" cy="85" r="2.5" fill="#ffffff" stroke="none" />
    <circle cx="20" cy="67.5" r="2.5" fill="#ffffff" stroke="none" />
